<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGit</title>
    <script>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem("opengit.theme");
        } catch (error) {
          preference = null;
        }
        var dark;
        if (preference === "light" || preference === "dark") {
          dark = preference === "dark";
        } else {
          dark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : true;
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";

        var palette = null;
        try {
          palette = localStorage.getItem("opengit.palette");
        } catch (error) {
          palette = null;
        }
        // Keep in sync with `PaletteName` in src/lib/theme.ts ("default" excluded: it needs no attribute).
        var palettes = [
          "purple",
          "classic",
          "sublime",
          "sublime-dark",
          "github",
          "copilot",
          "vercel",
          "code",
        ];
        if (palette !== null && palettes.indexOf(palette) !== -1) {
          document.documentElement.dataset.palette = palette;
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
