<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Repository cover / GitHub social preview (1280x640). Rendered into cover.png by scripts/make-cover.sh. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(37, 99, 235, .55), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(14, 165, 233, .26), transparent 60%),
      linear-gradient(135deg, #090d1a 0%, #0f1a33 60%, #0b1328 100%);
  }
  .brand { position: absolute; left: 76px; top: 86px; width: 540px; }
  .icon { width: 132px; height: 132px; display: block; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45)); }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #cfdcf7; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #e6edfb; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
    background: #1c1d22;
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #26272d; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .shot img { display: block; width: 1000px; }
</style>
</head>
<body>
  <div class="brand">
    <img class="icon" src="open-git-logo-trans.png" alt="OpenGit icon">
    <h1>OpenGit</h1>
    <p class="tag">A readable graph, hunk staging.<br>Git without the terminal.</p>
    <div class="chips">
      <span class="chip">Open source</span><span class="chip">Tauri 2</span><span class="chip">macOS</span><span class="chip">Windows</span><span class="chip">Linux</span>
    </div>
  </div>
  <div class="shot">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <img src="opengit-screenshot.png" alt="OpenGit">
  </div>
</body>
</html>
